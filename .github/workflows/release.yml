name: Release

# Publishes ModelShelf for Windows and Linux as a GitHub release.
#
# It starts by itself when the version number in version.py changes on main:
# the release and its tag (v1.2.3) are created for that version, so there is
# nothing to run by hand. A version that already has a tag is left alone.
#
# Two other ways to start it:
#   * push a tag like v1.2.3 yourself (the version is taken from the tag)
#   * "Run workflow" in the Actions tab: builds the version in version.py again
#     and refreshes the files of that release
on:
  push:
    branches: [main]
    paths: [version.py]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases of the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            release=true
          else
            version="$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' version.py)"
            tag="v$version"
            release=true
            if [ "$GITHUB_EVENT_NAME" = "push" ] && \
               git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::notice::Version $version already has the tag $tag. Nothing to release."
              release=false
            fi
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag release=$release"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            files: dist/ModelShelf*.exe
          # The oldest Ubuntu runner on purpose: a program built against an old
          # glibc also runs on newer distributions, but not the other way round.
          - name: Linux
            os: ubuntu-22.04
            files: dist/ModelShelf*.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MODELSHELF_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libdbus-1-3 \
            libfontconfig1 binutils

      - name: Install Python packages
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Set the version
        shell: python
        run: |
          import os
          version = os.environ["MODELSHELF_VERSION"]
          with open("version.py", "w", encoding="utf-8") as fh:
              fh.write(f'__version__ = "{version}"\n')
          print("version", version)

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build
        run: python build_exe.py --no-bump

      - name: Attach the build to this run
        uses: actions/upload-artifact@v4
        with:
          name: ModelShelf-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -la dist
          repo="${{ github.repository }}"
          # A version that is released again (a tag pushed twice, or "Run
          # workflow") must not fail the run: refresh the files instead.
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $TAG already exists: replacing its files."
            gh release upload "$TAG" dist/* --repo "$repo" --clobber
          else
            # Creates the tag too when it does not exist yet, on this commit.
            gh release create "$TAG" dist/* \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "ModelShelf $VERSION" \
              --generate-notes
          fi
