name: Release

# Push a tag like v0.2.0 to build ModelShelf for Windows and Linux and publish
# both as one GitHub release. "Run workflow" in the Actions tab builds the same
# things without releasing (the builds are attached to the run as artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            files: dist/ModelShelf*.exe
          # The oldest Ubuntu runner on purpose: a program built against an old
          # glibc also runs on newer distributions, but not the other way round.
          - name: Linux
            os: ubuntu-22.04
            files: dist/ModelShelf*.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libdbus-1-3 \
            libfontconfig1 binutils

      - name: Install Python packages
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Take the version from the tag
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if not m:
              sys.exit(f"Tag must look like v1.2.3, got {tag}")
          with open("version.py", "w", encoding="utf-8") as fh:
              fh.write(f'__version__ = "{m.group(1)}"\n')
          print("version", m.group(1))

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build
        run: python build_exe.py --no-bump

      - name: Attach the build to this run
        uses: actions/upload-artifact@v4
        with:
          name: ModelShelf-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          # A tag that is pushed again (for example after history was rewritten)
          # must not fail the run: refresh the files of the existing release.
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag already exists: replacing its files."
            gh release upload "$tag" dist/* --repo "$repo" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$repo" \
              --title "ModelShelf ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
